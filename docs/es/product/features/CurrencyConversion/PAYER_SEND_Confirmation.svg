    <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.9907" x="53.2656" y="177.9263">Present the terms of the transfer to the Payer</text>
    <path d="M363,133.5938 L363,218.5938 L663,218.5938 L663,143.5938 L653,133.5938 L363,133.5938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/>
