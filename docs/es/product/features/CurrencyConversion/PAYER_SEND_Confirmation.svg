    <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.2979" x="369" y="150.6606">Hi, John:</text>
    <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.7285" x="369" y="165.7935">I can do the transfer.</text>
    <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.46" x="369" y="180.9263">It&apos;ll cost you 55 BWP(10000 TZS) in fees</text>
    <text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.1699" x="369" y="196.0591">and Yaro will receive 44000 TZS.</text>
    <text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="279.5952" x="369" y="211.1919">Let me know if you want to go ahead?</text>
